name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/portfolio-api:${{ github.ref_name }}

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/portfolio-api:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint deploy/helm/portfolio-stack

      - name: Deploy staging
        if: startsWith(github.ref_name, 'v')
        run: |
          helm upgrade --install portfolio-staging deploy/helm/portfolio-stack \
            --namespace portfolio-staging --create-namespace \
            --set api.image.tag=${{ github.ref_name }} \
            --dry-run
