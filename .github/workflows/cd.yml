name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/portfolio-api:${{ github.ref_name }}

      - name: Trivy scan API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/portfolio-api:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Checkout frontend (paired tag)
        uses: actions/checkout@v4
        with:
          repository: devTugu/nextjs-fsd-portfolio-template
          ref: ${{ github.ref_name }}
          path: frontend

      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/devTugu/nextjs-fsd-portfolio-template/portfolio-admin:${{ github.ref_name }}

      - name: Trivy scan Admin image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/devTugu/nextjs-fsd-portfolio-template/portfolio-admin:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint and template
        run: |
          helm lint deploy/helm/portfolio-stack
          helm template portfolio-test deploy/helm/portfolio-stack \
            --set api.enabled=true \
            --set frontend.enabled=true \
            --set api.image.tag=${{ github.ref_name }} \
            --set frontend.image.tag=${{ github.ref_name }} > /dev/null

      - name: Deploy staging (dry-run)
        if: startsWith(github.ref_name, 'v')
        run: |
          helm upgrade --install portfolio-staging deploy/helm/portfolio-stack \
            --namespace portfolio-staging --create-namespace \
            --set api.image.tag=${{ github.ref_name }} \
            --set frontend.image.tag=${{ github.ref_name }} \
            --dry-run
