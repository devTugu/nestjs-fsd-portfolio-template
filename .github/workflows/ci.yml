name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test:cov

      - name: Security audit
        run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: quality

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: app_db
          MYSQL_USER: app_user
          MYSQL_PASSWORD: app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      DB_NAME: app_db
      NODE_ENV: test
      APP_PORT: 3001
      JWT_ACCESS_SECRET: ci_access_secret_minimum_32_characters
      JWT_REFRESH_SECRET: ci_refresh_secret_minimum_32_chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 1000
      SWAGGER_ENABLED: false
      REDIS_ENABLED: true
      REDIS_URL: redis://127.0.0.1:6379
      PERMISSION_CACHE_TTL_SEC: 60
      OTEL_ENABLED: false
      LOG_LEVEL: error
      MFA_ENCRYPTION_KEY: ci_mfa_encryption_key_minimum_32_chars
      MFA_ISSUER: Portfolio CI
      MFA_REQUIRED_ROLES: CONTENT_MANAGER
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: Admin123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run migrations and seed
        run: |
          for attempt in $(seq 1 30); do
            if npm run migration:run; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              echo "Database migrations failed"
              exit 1
            fi
            sleep 2
          done
          npm run seed

      - run: npm run test:e2e

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint and template
        run: |
          helm lint deploy/helm/re-cms-stack
          helm template portfolio-test deploy/helm/re-cms-stack \
            --set api.enabled=true \
            --set frontend.enabled=true > /dev/null
