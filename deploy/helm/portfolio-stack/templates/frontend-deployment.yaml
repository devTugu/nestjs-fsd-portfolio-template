apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portfolio-stack.fullname" . }}-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-admin
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          envFrom:
            - secretRef:
                name: {{ include "portfolio-stack.fullname" . }}-frontend-secrets
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
