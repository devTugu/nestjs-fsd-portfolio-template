{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portfolio-stack.fullname" . }}-frontend-secrets
type: Opaque
stringData:
  NODE_ENV: production
  API_INTERNAL_URL: "http://{{ include "portfolio-stack.fullname" . }}-api:{{ .Values.api.port }}/api/v1"
  NEXT_PUBLIC_APP_NAME: "Portfolio Admin"
  # Optional — override before production deploy
  # SENTRY_DSN: ""
  # OTEL_ENABLED: "false"
  # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  # OTEL_SERVICE_NAME: portfolio-admin
{{- end }}
