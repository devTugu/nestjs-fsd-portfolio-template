{{- if .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portfolio-stack.fullname" . }}-api-secrets
type: Opaque
stringData:
  DB_HOST: "{{ .Values.mysql.host | default "mysql" }}"
  DB_PORT: "{{ .Values.mysql.port | default "3306" }}"
  DB_USERNAME: "{{ .Values.mysql.auth.username }}"
  DB_PASSWORD: "{{ .Values.mysql.auth.password }}"
  DB_NAME: "{{ .Values.mysql.auth.database }}"
  JWT_ACCESS_SECRET: "CHANGE_ME_MIN_32_CHARS"
  JWT_REFRESH_SECRET: "CHANGE_ME_MIN_32_CHARS"
  MFA_ENCRYPTION_KEY: "CHANGE_ME_MIN_32_CHARS"
  REDIS_URL: "redis://{{ .Values.redis.host | default "redis" }}:6379"
  CORS_ORIGIN: "https://{{ .Values.ingress.host }}"
  APP_DISPLAY_NAME: "{{ .Values.brand.appDisplayName }}"
  MFA_ISSUER: "{{ .Values.brand.mfaIssuer }}"
  CONTACT_EMAIL_SUBJECT_PREFIX: "{{ .Values.brand.contactEmailSubjectPrefix }}"
  SEED_BRAND_NAME: "{{ .Values.brand.seedBrandName }}"
  SEED_CONTACT_EMAIL: "{{ .Values.brand.seedContactEmail }}"
  # Optional — override before production deploy
  # SENTRY_DSN: ""
{{- end }}
