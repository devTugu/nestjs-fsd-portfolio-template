global:
  imagePullPolicy: IfNotPresent

brand:
  appDisplayName: Portfolio Platform
  mfaIssuer: Portfolio Admin
  contactEmailSubjectPrefix: "[Portfolio Contact]"
  seedBrandName: Portfolio
  seedContactEmail: hello@example.com
  nextPublicAppName: Portfolio Admin
  nextPublicBrandName: Portfolio
  nextPublicSiteUrl: https://portfolio.example.com

api:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/devtugu/portfolio-api
    tag: latest
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/devtugu/portfolio-admin
    tag: latest
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

mysql:
  enabled: true
  host: mysql
  port: 3306
  auth:
    database: app_db
    username: app_user
    password: changeme

redis:
  enabled: true
  host: redis

ingress:
  enabled: true
  className: nginx
  host: portfolio.example.com
  tlsSecretName: portfolio-tls

observability:
  otelEnabled: true
  otelEndpoint: http://otel-collector:4318/v1/traces
