global:
  imagePullPolicy: IfNotPresent

brand:
  appDisplayName: RE CMS
  mfaIssuer: RE CMS Admin
  contactEmailSubjectPrefix: "[RE CMS Contact]"
  seedBrandName: Demo Group
  seedContactEmail: hello@example.com
  nextPublicAppName: RE CMS Admin
  nextPublicBrandName: Demo Group
  nextPublicSiteUrl: https://re-cms.example.com

api:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/devtugu/re-cms-api
    tag: latest
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/devtugu/re-cms-admin
    tag: latest
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

mysql:
  enabled: true
  host: mysql
  port: 3306
  auth:
    database: app_db
    username: app_user
    password: changeme

redis:
  enabled: true
  host: redis

ingress:
  enabled: true
  className: nginx
  host: re-cms.example.com
  tlsSecretName: re-cms-tls

observability:
  otelEnabled: true
  otelEndpoint: http://otel-collector:4318/v1/traces
